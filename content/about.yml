title: About Me
description: Learn more about my journey as a Software Engineer from Argentina, how I fell in love with computers, and how I approach building digital products today.
buttons:
  - label: Download CV
    icon: i-lucide-file-down
    to: /cv-santiago-rui.pdf
    target: _blank
intro:
  - "Hi, I'm Santiago Rui, a Software Engineer with 4 years of experience building digital products. I completed my technical degree at UNICEN (Universidad Nacional del Centro de la Provincia de Buenos Aires, Argentina), which gave me a solid toolkit of knowledge and, above all, real experience working as part of a team."
  - "I like creating solutions and getting involved in products from the root, wherever the problem leads me, and today I combine AI and agents to streamline development workflows and deliver integral solutions."
sections:
  - heading: How I Got Here
    paragraphs:
      - "I've always been drawn to the exact sciences. I chose this career because software is one of the few tools that lets us justify our reasoning and actually solve the problems of everyday life."
      - "While other kids were great at sports like football, I was fantasizing about having a computer of my own. I couldn't quite believe what my own eyes were showing me every time I saw one in action, and that early fascination is what gives me such an affinity for this branch of the sciences today. It also left me with a deep respect for other engineering fields: space systems, nuclear energy, and of course, artificial intelligence."
  - heading: How I Work
    paragraphs:
      - "My foundation is strong in algorithms, design patterns, system design and good practices, and I believe those fundamentals matter more than any specific framework. I also believe, fervently, that AI arrived to save us from repetitive tasks, but it will not force us to stop thinking. Every decision worth making is still made by the person who understands the problem."
  - heading: Beyond the Code
    paragraphs:
      - "When I'm not building, I enjoy keeping up with the sciences I grew up admiring, and spending time understanding how things work, from satellites to power plants to the models behind the tools I use every day."
      - "Thanks for stopping by. Feel free to browse my projects or get in touch if you'd like to collaborate!"
