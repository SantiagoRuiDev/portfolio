faq:
  title: Frequently Asked Questions
  description: Answers to common questions about how I work and what I can help you build.
  categories:
    - title: Services & Focus
      questions:
        - label: What kind of projects do you work on?
          content: |
            Mostly end-to-end product development: full-stack web applications with Vue, Nuxt and the Java / Spring Boot ecosystem, backed by PostgreSQL and shipped with Docker. I like getting involved from day one, from system design to release, and adding AI or agents where they genuinely save repetitive work.
        - label: How do you use AI in your work?
          content: |
            I believe AI arrived to free us from repetitive tasks, not to replace thinking. I use AI-assisted tooling and agents to speed up things like boilerplate, exploration and testing, while keeping architectural decisions, code quality and review firmly in human hands.
        - label: Do you work with startups or small teams?
          content: |
            Yes. My background as a freelance developer on Workana and Upwork taught me to ramp up fast, communicate clearly and deliver integral solutions without the need for large teams. I'm comfortable owning a feature from discovery through to deployment.
    - title: Working Together
      questions:
        - label: How do we start working together?
          content: |
            Reach out by email through the contact buttons and tell me a bit about your product or idea. We'll set up a first call to understand the problem, and from there I'll propose an approach, a rough timeline and how we'd collaborate day to day.
        - label: What does your process look like?
          content: |
            Pragmatic and iterative: first understand the problem and design the system, then build in short cycles with working software from early on. I work with Git-based workflows (pull requests, code reviews and CI) so everything stays transparent and maintainable.
        - label: Can you take over or maintain existing codebases?
          content: |
            Absolutely. A solid foundation in algorithms, design patterns and system design makes me confident when jumping into existing code: I can audit it, improve it and keep it growing, whether it's a Nuxt front end or a Spring Boot back end.
